<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Rectangle -->
  <rect x="20" y="30" width="60" height="40" fill="white" stroke="black" stroke-width="2"/>
  
  <!-- Feedback Path -->
  <path d="M80 45 L90 45 L90 65 L10 65 L10 45 L20 45" fill="none" stroke="black" stroke-width="2" stroke-dasharray="3,2"/>
  
  <!-- XOR Gate Symbol -->
  <circle cx="15" cy="55" r="5" fill="white" stroke="black" stroke-width="1.5"/>
  <line x1="12" y1="52" x2="18" y2="58" stroke="black" stroke-width="1.5"/>
  <line x1="12" y1="58" x2="18" y2="52" stroke="black" stroke-width="1.5"/>
  
  <!-- Clock Input -->
  <line x1="10" y1="35" x2="20" y2="35" stroke="black" stroke-width="2"/>
  <polygon points="15,30 15,40 10,35" fill="black"/>
  
  <!-- Text Labels -->
  <text x="50" y="55" font-family="Verdana" font-size="12" text-anchor="middle">LFSR</text>
  <text x="50" y="25" font-family="Verdana" font-size="8" text-anchor="middle">SEED</text>
  <text x="10" y="35" font-family="Verdana" font-size="8" text-anchor="end">CLK</text>
  <text x="10" y="75" font-family="Verdana" font-size="8" text-anchor="end">RST</text>
  <text x="85" y="40" font-family="Verdana" font-size="6" text-anchor="start">OUT</text>
  
  <!-- Reset Input -->
  <line x1="10" y1="75" x2="20" y2="75" stroke="black" stroke-width="2"/>
  
  <!-- Output -->
  <line x1="80" y1="50" x2="90" y2="50" stroke="black" stroke-width="2"/>
  <text x="85" y="47" font-family="Verdana" font-size="6" text-anchor="middle">n</text>
</svg>